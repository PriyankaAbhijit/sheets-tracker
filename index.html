<!-- Load Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, updateDoc, doc, Timestamp } 
    from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyC5YOno-5A_eoY-mYE8mYfci-8pdcrwIs8",
  authDomain: "dayssincetracker-d7c85.firebaseapp.com",
  projectId: "dayssincetracker-d7c85",
  storageBucket: "dayssincetracker-d7c85.firebasestorage.app",
  messagingSenderId: "207532054075",
  appId: "1:207532054075:web:38f330003ee24a96b36e1e",
  measurementId: "G-NJLWMT8J3E"
};

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const tasksCol = collection(db, "tasks");

  let tasks = [];

  // 1. LISTEN FOR REAL-TIME UPDATES
  onSnapshot(tasksCol, (snapshot) => {
      tasks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderTasks();
  });

  window.saveTask = async () => {
      const name = document.getElementById('taskName').value;
      const cat = document.getElementById('taskCat').value || 'General';
      const target = parseInt(document.getElementById('taskTarget').value) || 7;
      const dateVal = document.getElementById('taskDate').value;
      const lastDone = dateVal ? new Date(dateVal) : new Date();

      if (window.editingId) {
          const taskRef = doc(db, "tasks", window.editingId);
          await updateDoc(taskRef, { name, category: cat, target, lastDone: Timestamp.fromDate(lastDone) });
      } else {
          await addDoc(tasksCol, { name, category: cat, target, lastDone: Timestamp.fromDate(lastDone) });
      }
      toggleModal(false);
  };

  window.resetTask = async (id) => {
      if(confirm("Reset to today?")) {
          const taskRef = doc(db, "tasks", id);
          await updateDoc(taskRef, { lastDone: Timestamp.fromDate(new Date()) });
      }
  };

  // Update your renderTasks to handle Firebase Timestamps
  window.renderTasks = () => {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach(task => {
          const lastDoneDate = task.lastDone.toDate(); // Firebase specific
          const days = Math.floor((new Date() - lastDoneDate) / (1000 * 60 * 60 * 24));
          const status = days >= task.target ? 'urgent' : (days >= task.target / 2 ? 'warning' : 'ok');
          
          list.innerHTML += `
              <div class="task-card" onclick="resetTask('${task.id}')">
                  <div class="task-info">
                      <h3>${task.name}</h3>
                      <span>${task.category} • Target: ${task.target}d</span>
                  </div>
                  <div class="days-badge ${status}">${days}d</div>
              </div>`;
      });
  };
</script>
